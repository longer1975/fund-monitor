name: fund-monitor
on:
  repository_dispatch:
    types: [fund-monitor-trigger]   # cron-job.org 调用时用这个事件名
  schedule:
    - cron: "3,33 * * * *"          # 兜底：每30分钟一次，防外部服务本身失效
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fund-monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史,保证 rebase/push 稳定
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: 运行监控
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python monitor.py
      - name: 上传Excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel
          path: 限额公告.xlsx
          if-no-files-found: ignore
      - name: 保存历史记录（合并去重，避免并发运行时git冲突）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            # 不依赖这次checkout本身是否已经包含merge_seen.py
            # （如果这次运行触发时main还没有这个文件，本地checkout
            #  就会停留在旧版本），直接从远端最新提交里取出脚本内容
            # 执行，彻底避免"找不到文件"这类因checkout版本滞后导致的问题
            git show origin/main:merge_seen.py > /tmp/merge_seen.py
            python3 /tmp/merge_seen.py

            # 以远端最新提交为基准重置，避免任何历史分叉，
            # 再把合并好的结果写回工作区
            git reset --hard origin/main
            cp /tmp/merged_seen.json seen_announcements.json
            git add seen_announcements.json

            if git diff --cached --quiet; then
              echo "无新增记录需要提交"
              break
            fi

            git commit -m "update seen records [skip ci]"

            if git push origin HEAD:main; then
              echo "推送成功"
              break
            fi

            echo "推送失败（可能有并发写入），第${attempt}次重试..."
            sleep $((attempt * 5))
          done
